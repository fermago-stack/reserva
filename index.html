<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>reserve sua mesa</title>
</head>
<body>
    <div class="reserva_de_mesa">
        <h1>Reserve sua Mesa</h1>
        <h2>Por favor preencha o formulário abaixo com atenção, 
            para que dodemos atende-lo da melhor forma possivel. Seja bem vindo!</h2>
    </div>

    <div class="formulario">
        <form action="processar_reserva.php" method="POST">
            
            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder=" Nome" size="20" required>
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" name="sobrenome" placeholder=" Sobrenome" size="20" required>
            </div>    

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder=" ex: nome@exemplo.com" size="20" required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="telefone" id="telefone" name="telefone" placeholder=" (xx) xxxx-xxxx" size="20" required>
            </div>

            <div class="campo">
                <label for="numero de pessoas">Numero de Pessoas:</label>
                <input type="number" id="numero de pessoas" name="Numero de Pessoas" size="5" required>
            </div>

            <h2> RESERVA </h2>

            <div class="campo">
                <label for="tipo de reserva">Tipo de Reserva</label>
                    <select id="tipo de reserva" name="tipo de reserva" required>
                        <option> Almoço, Jantar ou Brunch</option>
                        <option>Aperitivo ou Happy Hour</option>
                        <option>Grandes grupos e Eventos</option>
                        <option>Experiência Gastronomica</option>
                    </select>
            </div>

            <div class="campo">
                <label for="se outro">Se "Outro" acima, especifique:</label>
                <input type="text" id="se outro" name="se outro" size="25">
            </div>

            <div class="campo">
                <label for="pedidos">Pedidos Especiais:</label>
                <input type="text" id="pedidos" name="pedidos" size="25">
            </div>

            <div class="botao">
                <button class="button" type="submit">Enviar</button>
            </div>
        
        </form>
</body>
</html>
